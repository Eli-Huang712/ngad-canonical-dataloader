[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngad-canonical-dataloader"
version = "0.1.0"
description = "Standalone NGAD canonical Dataset loading and TCP128 sample construction"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "pyyaml",
    "torch",
]

[project.optional-dependencies]
canonical = [
    "av",
    "pylance>=0.30",
    "pyarrow",
]
test = ["pytest"]
visualize = ["rerun-sdk>=0.26,<0.27"]

[tool.setuptools.packages.find]
include = ["ngad_canonical_dataloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
