schema_version: ngad_canonical_dataloader_v1

dataset:
  dataset_dirs:
    - name: libero
      path: /path/to/canonical/libero
      mask_path: /path/to/canonical/libero/mask.json
      normalization_stats_path: /path/to/stats/libero.json

  target_rgb_fps: 10
  target_action_fps: 20

  action_horizon: 32
  recent_memory_frames: 24
  long_memory_anchor_interval_frames: 50
  long_memory_window_frames: 8
  long_memory_slots: 5
  action_history_horizon: 10

  split: train
  validation_split: 0.0
  validation_seed: 3407
  max_samples: null
